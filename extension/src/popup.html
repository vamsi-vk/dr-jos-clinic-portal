<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MioSalon Extension</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        width: 320px;
        background: #f7f4ef;
        color: #1c1917;
      }
      header {
        background: #0f766e;
        color: #fff;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 14px;
      }
      main {
        padding: 14px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
        padding: 8px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
      }
      .password-wrap {
        position: relative;
        margin-bottom: 10px;
      }
      .password-wrap input {
        margin-bottom: 0;
        padding-right: 36px;
      }
      .toggle-password {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: auto;
        padding: 4px;
        background: transparent;
        color: #78716c;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        line-height: 0;
      }
      .toggle-password:hover {
        background: #f5f5f4;
        color: #1c1917;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #1c1917;
        border: 1px solid #d6d3d1;
        margin-top: 8px;
      }
      .msg {
        font-size: 12px;
        margin-top: 10px;
        color: #78716c;
      }
      .err {
        color: #b91c1c;
      }
      .ok {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <header>MioSalon Extension — staff sign-in</header>
    <main>
      <div id="signedOut">
        <label for="apiBase">API base URL</label>
        <input id="apiBase" type="url" value="http://localhost:3002" />
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" />
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" />
          <button
            id="togglePassword"
            type="button"
            class="toggle-password"
            aria-label="Show password"
            title="Show password"
          >
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button id="loginBtn" type="button">Sign in</button>
      </div>
      <div id="signedIn" hidden>
        <p id="who" class="msg ok"></p>
        <button id="logoutBtn" class="secondary" type="button">Sign out</button>
      </div>
      <p id="message" class="msg"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
